# ================================================================
# BRAJVAAS & PAY4U UNIFIED NGINX CONFIGURATION
# Preserves all existing services (Pay4u, Amul, Hisab) untouched
# Adds port 5004 upstream for persistent Brajvaas API & Database
# ================================================================

# ================================================================
# UPSTREAMS
# ================================================================
upstream pay4u_backend {
    server localhost:5001;
}

upstream amul_backend {
    server localhost:4000;
}

upstream hisab_backend {
    server localhost:5002;
}

upstream pay4u_v2_backend {
    server localhost:5003;
}

# NEW: Brajvaas Central Node.js API Server (Persistent Database outside web root)
upstream brajvaas_backend {
    server localhost:5004;
}

# ================================================================
# 1. PAY4U CONFIGURATION (UNTOUCHED & PRESERVED)
# ================================================================
server {
    listen 80;
    listen [::]:80;
    server_name pay4u.co.in www.pay4u.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/pay4u/frontend/build;
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pay4u.co.in www.pay4u.co.in;

    ssl_certificate /etc/letsencrypt/live/pay4u.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay4u.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pay4u/frontend/build;
    index index.html;

    # === NEW PAY4U V2 SERVICE (Port 5003) ===
    location = /v2 {
        return 301 $scheme://$host/v2/;
    }

    location /v2/ {
        proxy_pass http://pay4u_v2_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # === EXISTING PAY4U SERVICES (Unchanged) ===
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://pay4u_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://pay4u_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ================================================================
# 2. AMUL CONFIGURATION (UNTOUCHED & PRESERVED)
# ================================================================
server {
    listen 80;
    listen [::]:80;
    server_name amul.pay4u.co.in;

    location / {
        proxy_pass http://amul_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ================================================================
# 3. HISAB CONFIGURATION (UNTOUCHED & PRESERVED)
# ================================================================
server {
    listen 80;
    listen [::]:80;
    server_name hisab.pay4u.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hisab.pay4u.co.in;

    ssl_certificate /etc/letsencrypt/live/hisab.pay4u.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hisab.pay4u.co.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://hisab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# ================================================================
# 4. BRAJVAAS WEB ADMIN PORTAL (admin.brajvaas.in)
# ================================================================
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name admin.brajvaas.in;
    return 301 https://$host$request_uri;
}

# HTTPS Web Admin Portal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.brajvaas.in;

    ssl_certificate /etc/letsencrypt/live/brajvaas.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brajvaas.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/brajvaas;
    index admin_portal.html;

    client_max_body_size 50M;

    # Dynamic API Routes proxying to persistent Node backend (Port 5004)
    location /api/ {
        proxy_pass http://brajvaas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct APK downloads
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="brajvaas.apk"';
        add_header Cache-Control "no-cache";
    }

    # Static admin console
    location / {
        try_files $uri $uri/ /admin_portal.html;
    }

    # Block sensitive system files
    location ~ /\.(git|gradle|idea|env) {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ================================================================
# 5. BRAJVAAS MAIN PORTAL (brajvaas.in & www.brajvaas.in)
# ================================================================
# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name brajvaas.in www.brajvaas.in;
    return 301 https://$host$request_uri;
}

# HTTPS Main Portal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brajvaas.in www.brajvaas.in;

    ssl_certificate /etc/letsencrypt/live/brajvaas.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brajvaas.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/brajvaas;
    index index.html admin_portal.html;

    client_max_body_size 50M;

    # Dynamic API Routes (Properties, Visitor Count, Devotee Callback Inquiries)
    location /api/ {
        proxy_pass http://brajvaas_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct APK downloads with proper MIME type
    location ~* \.apk$ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition 'attachment; filename="brajvaas.apk"';
        add_header Cache-Control "no-cache";
    }

    # Main web landing page & contact section
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden environment and git files
    location ~ /\.(git|gradle|idea|env) {
        deny all;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
